plugins { id 'com.android.application'; id 'com.chaquo.python' }

chaquopy {
    defaultConfig {
        version = "3.12"
        buildPython(providers.gradleProperty('bonsaiBuildPython').orElse('python3').get())
        pip {
            install("sympy==1.14.0")
            install("mpmath==1.3.0")
        }
    }
}

def enableVulkan = providers.gradleProperty('bonsaiVulkan').orElse('false').get().toBoolean()

android {
    namespace 'de.bonsai.offline'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'de.bonsai.offline'
        minSdk 28
        targetSdk 35
        versionCode 19
        versionName '0.5.3'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release',
                          "-DBONSAI_VULKAN=${enableVulkan ? 'ON' : 'OFF'}"
                cppFlags '-std=c++17'
                targets 'bonsai-jni'
                if (enableVulkan) {
                    def vulkanSdk = System.getenv('BONSAI_VULKAN_SDK')
                    def glslc = System.getenv('BONSAI_GLSLC')
                    if (vulkanSdk) {
                        arguments "-DVulkan_INCLUDE_DIR=${vulkanSdk}/include",
                                  "-DSPIRV-Headers_DIR=${vulkanSdk}/share/cmake/SPIRV-Headers"
                    }
                    if (glslc) arguments "-DVulkan_GLSLC_EXECUTABLE=${glslc}"
                }
            }
        }
        buildConfigField 'boolean', 'VULKAN_BUILD', enableVulkan.toString()
        buildConfigField 'String', 'RUNTIME_REVISION', '"e3de715222b2667c54a267441159a5729f11155e"'
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            // Robolectric's Windows native SQLite can crash its finalizer when
            // native state survives across class sandboxes. Isolate classes;
            // all tests and the real SQLite backend remain enabled.
            if (System.getProperty('os.name').startsWith('Windows')) forkEvery = 1
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            // Retain the distributed package identity without producing a debug build.
            applicationIdSuffix '.debug'
            debuggable false
            minifyEnabled false
        }
    }
    packaging { jniLibs { useLegacyPackaging false } }
}

dependencies {
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
