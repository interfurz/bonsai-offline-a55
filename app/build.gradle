plugins { id 'com.android.application' }

def enableVulkan = providers.gradleProperty('bonsaiVulkan').orElse('false').get().toBoolean()

android {
    namespace 'de.bonsai.offline'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'de.bonsai.offline'
        minSdk 28
        targetSdk 35
        versionCode 15
        versionName '0.5.1.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release',
                          "-DBONSAI_VULKAN=${enableVulkan ? 'ON' : 'OFF'}"
                cppFlags '-std=c++17'
                targets 'bonsai-jni'
                if (enableVulkan) {
                    def vulkanSdk = System.getenv('BONSAI_VULKAN_SDK')
                    def glslc = System.getenv('BONSAI_GLSLC')
                    if (vulkanSdk) {
                        arguments "-DVulkan_INCLUDE_DIR=${vulkanSdk}/include",
                                  "-DSPIRV-Headers_DIR=${vulkanSdk}/share/cmake/SPIRV-Headers"
                    }
                    if (glslc) arguments "-DVulkan_GLSLC_EXECUTABLE=${glslc}"
                }
            }
        }
        buildConfigField 'boolean', 'VULKAN_BUILD', enableVulkan.toString()
        buildConfigField 'String', 'RUNTIME_REVISION', '"e3de715222b2667c54a267441159a5729f11155e"'
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            // Retain the distributed package identity without producing a debug build.
            applicationIdSuffix '.debug'
            debuggable false
            minifyEnabled false
        }
    }
    packaging { jniLibs { useLegacyPackaging false } }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
